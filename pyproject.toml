[project]
name = "mrptrap"
version = "0.1.0"
description = "MRP Trap: Auditing LLM price anchoring on ONDC maximum_value"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Local tooling (CLI, simulator, clamp — run on your laptop)
    "modal>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "openai>=1.20.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mrptrap = "mrptrap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrptrap"]
